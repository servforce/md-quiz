<div x-show="route.name === 'attempt-detail'" class="admin-mobile-pane-grid grid min-w-0 gap-4 xl:items-start" :class="attemptEvaluationExpanded ? 'xl:grid-cols-1' : 'xl:grid-cols-[minmax(0,1.15fr)_minmax(0,.85fr)]'">
  <header class="admin-surface col-span-full min-w-0 rounded-xl p-4 sm:p-5">
    <div class="flex flex-wrap items-start justify-between gap-3">
      <div class="min-w-0">
        <h2 class="break-words text-xl font-semibold text-slate-900" x-text="(attemptDetail.quiz_paper?.candidate_name || '候选人') + '的答卷'"></h2>
        <p class="mt-1 text-sm leading-6 text-slate-600 [overflow-wrap:anywhere]" x-text="assignmentQuizTitle(attemptDetail.quiz_paper)"></p>
        <div class="mt-1 break-all font-mono text-[11px] leading-5 text-slate-500" x-text="attemptDetail.quiz_paper?.token || route.params.token"></div>
      </div>
      <a x-show="attemptDetail.quiz_paper?.candidate_id" :href="'/admin/candidates/' + attemptDetail.quiz_paper?.candidate_id" @click="go($el.href, $event)" class="shrink-0 rounded-lg border border-slate-200 px-3 py-2 text-xs text-slate-700 hover:bg-blue-50 hover:text-blue-700">查看候选人资料</a>
    </div>
  </header>
            <div
              x-show="shouldShowAdminCompactTabs('attempt-detail')"
              x-cloak
              data-admin-compact-tabs="attempt-detail"
              class="hidden admin-compact-tabs md:block xl:hidden"
            >
              <div class="admin-compact-tabs__track" role="tablist" aria-label="答题详情内容切换">
                <template x-for="tab in adminCompactTabs('attempt-detail')" :key="tab.id">
                  <button
                    type="button"
                    role="tab"
                    @click="attemptEvaluationExpanded = false; setAdminCompactTab('attempt-detail', tab.id)"
                    :class="adminCompactTab('attempt-detail') === tab.id ? 'admin-compact-tab--active' : 'admin-compact-tab--inactive'"
                    :aria-selected="String(adminCompactTab('attempt-detail') === tab.id)"
                    class="admin-compact-tab"
                    x-text="tab.label"
                  ></button>
                </template>
              </div>
            </div>

            <section
              x-show="!attemptEvaluationExpanded && adminCompactPanelVisible('attempt-detail', 'review')"
              class="assignment-surface admin-surface @container/review min-w-0 rounded-xl p-4 sm:p-5"
              :class="assignmentDetailSectionClass(attemptDetail.quiz_paper)"
            >
              <div class="flex flex-col gap-3">
                <div>
                  <h2 class="text-xl font-semibold tracking-[-0.03em] text-slate-900">答题回放</h2>
                  <p class="mt-1 text-sm text-slate-600">查看题干、作答内容、正确答案和评分理由。</p>
                </div>
                <label x-show="attemptReviewAnswers().some(question => attemptReviewIsTraitQuestion(question))" class="flex w-fit cursor-pointer items-center gap-2 text-xs text-slate-600">
                  <input type="checkbox" x-model="attemptShowOptionWeights" class="h-4 w-4 accent-blue-600" />
                  显示选项权重
                </label>
                <div class="flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between sm:gap-4">
                  <div class="min-w-0 flex-1">
                    <div class="flex flex-wrap items-center gap-2">
                      <span :class="assignmentSourceBadgeClass()" x-text="attemptDetail.quiz_paper?.source_label || '答题记录'"></span>
                      <span :class="assignmentStatusBadgeClass(attemptDetail.quiz_paper)" x-text="attemptDetail.quiz_paper?.status_label || '状态未知'"></span>
                      <span
                        x-show="assignmentIgnoresTiming(attemptDetail.quiz_paper)"
                        class="assignment-badge border-amber-200 bg-amber-50 text-amber-700"
                      >已忽略计时</span>
                      <span
                        x-show="canToggleAssignmentHandling(attemptDetail.quiz_paper)"
                        :class="assignmentHandlingBadgeClass(attemptDetail.quiz_paper)"
                        x-text="assignmentHandlingLabel(attemptDetail.quiz_paper)"
                      ></span>
                      <span class="assignment-badge border-rose-200 bg-rose-50 text-rose-700">
                        疑似AI-<span class="tabular-nums" x-text="attemptDetail.quiz_paper?.suspected_ai_question_count || 0"></span>道
                      </span>
                      <span
                        x-show="attemptReviewAnswers().some(question => attemptQuestionHasInputSignals(question))"
                        class="assignment-badge border-amber-200 bg-amber-50 text-amber-800"
                        title="发现大段粘贴或瞬时新增，请查看对应简答题的输入行为记录"
                      >输入需复核</span>
                    </div>
                    <div x-show="assignmentHandledMeta(attemptDetail.quiz_paper)" class="mt-3 text-[11px] text-slate-500" x-text="'处理人：' + assignmentHandledMeta(attemptDetail.quiz_paper)"></div>
                  </div>
                  <div class="assignment-action-group sm:ml-auto" role="group" aria-label="答题实例操作">
                    <button
                      x-show="canToggleAssignmentHandling(attemptDetail.quiz_paper)"
                      @click="toggleAssignmentHandling(attemptDetail.quiz_paper)"
                      type="button"
                      :class="assignmentActionButtonClass('handling', attemptDetail.quiz_paper)"
                      x-text="assignmentHandlingActionLabel(attemptDetail.quiz_paper)"
                    ></button>
                    <button
                      x-show="canDeleteAssignment(attemptDetail.quiz_paper)"
                      @click="deleteAssignment(attemptDetail.quiz_paper)"
                      type="button"
                      :class="assignmentActionButtonClass('danger', attemptDetail.quiz_paper)"
                    >删除邀约</button>
                  </div>
                </div>
              </div>

              <div x-show="attemptReviewAnswers().length" class="-mx-4 mt-4 divide-y divide-slate-200 border-y border-slate-200 sm:-mx-5">
                <template x-for="(question, index) in attemptReviewAnswers()" :key="question.qid || index">
                  <article class="min-w-0 bg-white">
                    <div class="border-b border-slate-200/80 bg-slate-50 px-4 py-3 sm:px-5">
                      <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
                        <div class="flex min-w-0 flex-wrap items-center gap-2">
                          <span class="text-[17px] font-black tracking-[-0.03em] text-slate-900" x-text="question.label || question.qid || ('Q' + (index + 1))"></span>
                          <span class="rounded-full border border-blue-200 bg-blue-50 px-2.5 py-1 text-xs font-semibold text-blue-700" x-text="questionTypeLabel(question.type)"></span>
                          <span x-show="question.has_score" class="rounded-full border border-slate-200 bg-white px-2.5 py-1 text-xs font-semibold text-slate-700" x-text="question.score_display"></span>
                          <span :class="attemptReviewQuestionStatusClass(question)" x-text="attemptReviewQuestionStatusLabel(question)"></span>
                          <span class="font-mono text-xs tabular-nums text-slate-600" x-text="question.activity?.duration_ms != null ? '用时 ' + attemptActivityTime(question.activity.duration_ms) : '耗时暂无数据'"></span>
                          <span x-show="question.activity?.end_reason" class="text-xs text-slate-500" x-text="attemptActivityEndReason(question.activity?.end_reason)"></span>
                          <span
                            x-show="attemptQuestionHasInputSignals(question)"
                            class="rounded-full border border-amber-200 bg-amber-50 px-2 py-0.5 text-[11px] font-semibold text-amber-800"
                            title="检测到大段粘贴或瞬时新增，请展开输入行为记录人工复核"
                          >输入需复核</span>
                        </div>
                        <div class="text-[11px] font-medium text-slate-400 sm:pl-4" x-show="Number(question.max_points || 0) > 0" x-text="'满分 ' + Number(question.max_points || 0) + ' 分'"></div>
                      </div>
                    </div>

                    <div class="min-w-0 px-4 py-4 sm:px-5">
                      <div class="quiz-rich admin-markdown max-w-[75ch] text-sm leading-7 text-slate-800 [overflow-wrap:anywhere]" x-html="question.stem_html || ''"></div>

                      <template x-if="attemptReviewHasOptions(question)">
                        <div class="mt-4 min-w-0 divide-y divide-slate-200 border-y border-slate-200">
                          <template x-for="option in (question.options || [])" :key="`${question.qid || index}-${option.key || option.text || ''}`">
                            <div :class="attemptReviewOptionRowClass(question, option)" class="grid min-w-0 grid-cols-[auto_minmax(0,1fr)] items-start gap-2 px-3 py-3 @min-[32rem]/review:grid-cols-[auto_minmax(0,1fr)_auto]">
                              <span class="inline-flex h-6 min-w-6 shrink-0 items-center justify-center rounded-lg border border-blue-100 bg-white px-1.5 text-[11px] font-semibold text-blue-700" x-text="option.key || '-'"></span>
                              <div class="min-w-0 flex-1">
                                <div class="quiz-rich admin-markdown text-sm leading-5 text-slate-700" x-html="option.text_html || ''"></div>
                                <div x-show="attemptShowOptionWeights && optionTraits(option).length" class="mt-2 flex flex-wrap gap-1.5">
                                  <template x-for="trait in optionTraits(option)" :key="`${option.key || ''}-${trait.name}`">
                                    <span :style="traitBadgeStyle(trait.name)" class="rounded-full border px-2 py-0.5 text-[11px] font-medium">
                                      <span x-text="trait.name"></span>
                                      <span class="ml-1 font-semibold" x-text="trait.scoreText"></span>
                                    </span>
                                  </template>
                                </div>
                              </div>
                              <div class="col-start-2 flex min-w-0 flex-wrap gap-1.5 @min-[32rem]/review:col-start-auto @min-[32rem]/review:justify-end">
                                <span x-show="attemptReviewOptionIsCorrect(question, option)" class="shrink-0 rounded-full border border-emerald-200 bg-white px-2 py-0.5 text-[11px] font-semibold text-emerald-700">正确答案</span>
                                <span
                                  x-show="attemptReviewOptionIsSelected(question, option)"
                                  :class="attemptReviewOptionSelectionBadgeClass(question, option)"
                                >候选人选择</span>
                              </div>
                            </div>
                          </template>
                        </div>
                      </template>

                      <template x-if="attemptReviewIsShortQuestion(question)">
                        <div class="mt-4 grid min-w-0 gap-3 @min-[40rem]/review:grid-cols-2">
                          <div class="min-w-0 rounded-lg border border-slate-200 bg-slate-50/70">
                            <div class="flex items-center justify-between gap-3 border-b border-slate-200 px-3.5 py-2">
                              <div class="text-[12px] font-semibold text-slate-500">候选人作答</div>
                              <button
                                @click="toggleAttemptSuspectedAi(question)"
                                type="button"
                                :class="attemptSuspectedAiButtonClass(question)"
                                :aria-pressed="String(attemptQuestionIsSuspectedAi(question))"
                                :aria-label="attemptQuestionIsSuspectedAi(question) ? '取消疑似 AI 标记' : '标记为疑似 AI'"
                              >
                                <span class="material-symbols-rounded attempt-suspected-ai-toggle__icon" x-text="attemptQuestionIsSuspectedAi(question) ? 'check_box' : 'check_box_outline_blank'"></span>
                                疑似AI
                              </button>
                            </div>
                            <div class="whitespace-pre-wrap px-3.5 py-3 text-sm leading-7 text-slate-700 [overflow-wrap:anywhere]" x-text="attemptReviewShortAnswerText(question)"></div>
                          </div>
                          <div x-show="question.reason" class="min-w-0 rounded-lg border border-blue-100 bg-blue-50/40">
                            <div class="border-b border-blue-100 px-3.5 py-2 text-[12px] font-semibold text-blue-700">评分理由</div>
                            <div class="whitespace-pre-wrap px-3.5 py-3 text-sm leading-7 text-slate-700 [overflow-wrap:anywhere]" x-text="question.reason"></div>
                          </div>
                        </div>
                      </template>

                      <template x-if="attemptReviewIsShortQuestion(question) && question.activity?.input">
                        <details class="mt-4 border-t border-slate-200">
                          <summary class="cursor-pointer px-3.5 py-2.5 text-[13px] font-medium text-slate-700">输入行为记录</summary>
                          <div class="space-y-3 border-t border-slate-200 px-3.5 py-3 text-xs text-slate-600">
                            <div class="flex flex-wrap gap-x-4 gap-y-1 tabular-nums">
                              <span x-text="'文本变动 ' + (question.activity.input.summary?.event_count || 0) + ' 次'"></span>
                              <span x-text="'新增 ' + (question.activity.input.summary?.inserted_chars || 0) + ' 字'"></span>
                              <span x-text="'删除 ' + (question.activity.input.summary?.deleted_chars || 0) + ' 字'"></span>
                              <span x-text="'粘贴 ' + (question.activity.input.summary?.paste_count || 0) + ' 次'"></span>
                              <span x-text="'最长停顿 ' + attemptActivityTime(question.activity.input.summary?.max_pause_ms || 0)"></span>
                            </div>
                            <div x-show="question.activity.input.signals?.length" class="rounded-lg border border-amber-200 bg-amber-50 px-3 py-2 text-amber-900">
                              <div class="font-semibold">建议人工复核的输入线索</div>
                              <template x-for="(signal, signalIndex) in question.activity.input.signals || []" :key="signalIndex">
                                <div class="mt-1 tabular-nums" x-text="attemptActivityTime(signal.elapsed_ms) + '：' + (signal.kind === 'large_paste' ? '大段粘贴' : '瞬时新增') + ' ' + signal.added_chars + ' 字'"></div>
                              </template>
                            </div>
                            <p x-show="question.activity.input.incomplete || question.activity.input.truncated" class="text-amber-700" x-text="question.activity.input.truncated ? '事件数量达到上限，以下时间线已截断；汇总仍继续累计。' : '部分事件未送达，时间线可能不完整。'"></p>
                            <p class="text-slate-500">断网或突然关闭页面时，最后未送达的事件可能缺失。时间线只记录文本变动，不记录按键或中途文本。</p>
                            <div class="max-h-64 overflow-auto border-y border-slate-200 divide-y divide-slate-100">
                              <template x-for="(event, eventIndex) in attemptInputEvents(question)" :key="event.seq + '-' + eventIndex">
                                <div class="flex flex-wrap gap-x-3 gap-y-1 py-1.5 tabular-nums">
                                  <span class="font-mono text-slate-500" x-text="attemptActivityTime(event.elapsed_ms)"></span>
                                  <span x-text="attemptInputEventKind(event.kind)"></span>
                                  <span x-text="'+' + event.added_chars + ' / -' + event.deleted_chars + ' 字'"></span>
                                  <span x-text="'当前 ' + event.length_after + ' 字'"></span>
                                </div>
                              </template>
                            </div>
                            <button x-show="attemptInputHasMore(question)" @click="showMoreAttemptInput(question)" type="button" class="rounded-md border border-slate-200 px-3 py-1.5 text-slate-700 hover:bg-slate-50">显示后续记录</button>
                          </div>
                        </details>
                      </template>

                      <div
                        x-show="!attemptReviewIsShortQuestion(question) && question.reason"
                        class="mt-3 overflow-hidden rounded-xl border border-blue-100 bg-blue-50/55"
                      >
                        <div class="border-b border-blue-100 px-3.5 py-2 text-[12px] font-semibold text-blue-700">评分理由</div>
                        <div class="whitespace-pre-wrap px-3.5 py-3 text-sm leading-7 text-slate-700 [overflow-wrap:anywhere]" x-text="question.reason"></div>
                      </div>

                      <template x-if="question.rubric">
                        <details class="border-t border-slate-200" :class="{ 'mt-4': !(attemptReviewIsShortQuestion(question) && question.activity?.input) }">
                          <summary class="cursor-pointer px-3.5 py-2.5 text-[13px] font-medium text-slate-700">评分标准</summary>
                          <div class="quiz-rich admin-markdown border-t border-slate-200 px-3.5 py-2.5 text-[11px] leading-5 text-slate-600" x-html="question.rubric_html || ''"></div>
                        </details>
                      </template>
                    </div>
                  </article>
                </template>
              </div>

              <div x-show="!attemptReviewAnswers().length" class="mt-4 rounded-2xl border border-dashed border-slate-200 bg-slate-50/75 px-6 py-10 text-center">
                <div class="text-sm font-semibold text-slate-700">当前暂无可回放的答题内容</div>
                <p class="mt-2 text-sm leading-6 text-slate-500" x-text="assignmentStatusValue(attemptDetail.quiz_paper) === 'grading' ? '系统正在整理判卷结果，完成后会自动展示完整题目回放。' : '请检查该答题是否已生成归档，或确认当前测验版本仍能读取题目快照。'"></p>
              </div>
            </section>

            <section
              x-show="attemptEvaluationExpanded || adminCompactPanelVisible('attempt-detail', 'evaluation')"
              class="admin-surface min-w-0 rounded-xl p-4 sm:p-5"
            >
              <div class="flex flex-wrap items-start justify-between gap-3">
                <div><h2 class="text-xl font-semibold tracking-[-0.03em] text-slate-900">智能评价</h2><p class="mt-1 text-sm leading-6 text-slate-600">汇总总分、主倾向、综合分析和候选人简评。</p></div>
                <button type="button" @click="attemptEvaluationExpanded = !attemptEvaluationExpanded" :aria-expanded="String(attemptEvaluationExpanded)" class="shrink-0 rounded-lg border border-slate-200 px-3 py-2 text-xs text-slate-700 hover:bg-blue-50 hover:text-blue-700" x-text="attemptEvaluationExpanded ? '返回答卷布局' : '全宽阅读'"></button>
              </div>

              <div class="min-w-0">
                <div class="mt-4 grid gap-3">
                  <div class="grid gap-3 sm:grid-cols-2">
                    <div x-show="attemptEvaluationShowScore()" class="rounded-[1.1rem] border border-blue-100 bg-blue-50/55 px-4 py-3">
                      <div class="text-[12px] font-semibold uppercase tracking-[0.18em] text-blue-700">总分</div>
                      <div class="mt-2 text-2xl font-black tracking-[-0.04em] text-slate-900" x-text="attemptReviewEvaluation().score_display || '-'"></div>
                    </div>
                    <div class="rounded-[1.1rem] border border-slate-200 bg-slate-50/80 px-4 py-3">
                      <div class="text-[12px] font-semibold uppercase tracking-[0.18em] text-slate-500">结果模式</div>
                      <div class="mt-2 text-lg font-bold tracking-[-0.03em] text-slate-900" x-text="attemptEvaluationResultModeLabel()"></div>
                    </div>
                  </div>

                  <div x-show="attemptEvaluationPrimaryDimensions().length" class="border-t border-slate-200/80 pt-4">
                    <div class="text-[12px] font-semibold uppercase tracking-[0.18em] text-sky-700">主倾向</div>
                    <div class="mt-3 flex flex-wrap gap-2">
                      <template x-for="dimension in attemptEvaluationPrimaryDimensions()" :key="dimension">
                        <span :style="traitBadgeStyle(dimension)" class="rounded-full border px-3 py-1 text-xs font-semibold" x-text="dimension"></span>
                      </template>
                    </div>
                  </div>

                  <div x-show="attemptEvaluationTraitPairs().length" class="border-t border-slate-200/80 pt-4">
                    <div class="text-sm font-semibold text-slate-900">维度对照</div>
                    <div class="mt-3 divide-y divide-slate-200/80">
                      <template x-for="pair in attemptEvaluationTraitPairs()" :key="`${pair.left || ''}-${pair.right || ''}`">
                        <div class="py-3 first:pt-0 last:pb-0">
                          <div class="flex items-start justify-between gap-3">
                            <div>
                              <div class="text-sm font-semibold tabular-nums text-slate-800" x-text="`${pair.left || '-'} ${pair.left_score || 0} / ${pair.right || '-'} ${pair.right_score || 0}`"></div>
                              <div class="mt-1 text-xs leading-5 text-slate-500" x-text="pair.description || '按对立维度对照输出主倾向。'"></div>
                            </div>
                            <span :style="traitBadgeStyle(pair.winner || '')" class="rounded-full border px-2.5 py-1 text-[11px] font-semibold" x-text="pair.winner || '-'"></span>
                          </div>
                        </div>
                      </template>
                    </div>
                  </div>

                  <div x-show="!attemptEvaluationTraitPairs().length && attemptEvaluationDimensionList().length" class="border-t border-slate-200/80 pt-4">
                    <div class="text-sm font-semibold text-slate-900">维度累计</div>
                    <div class="mt-3 divide-y divide-slate-200/80">
                      <template x-for="item in attemptEvaluationDimensionList()" :key="item.dimension || ''">
                        <div class="py-3 first:pt-0 last:pb-0">
                          <div class="flex items-center justify-between gap-3">
                            <span class="text-sm font-semibold text-slate-800" x-text="item.dimension || '-'"></span>
                            <span class="text-sm font-bold text-slate-900" x-text="item.score || 0"></span>
                          </div>
                          <div class="mt-1 text-xs leading-5 text-slate-500" x-text="item.meaning || '当前维度暂无额外说明。'"></div>
                        </div>
                      </template>
                    </div>
                  </div>

                  <div x-show="attemptReviewEvaluation().final_analysis" class="border-t border-slate-200/80 pt-4">
                    <div class="text-sm font-semibold text-emerald-800">综合分析</div>
                    <div class="mt-2 max-w-[75ch] whitespace-pre-line text-sm leading-7 text-slate-700 [overflow-wrap:anywhere]" x-text="attemptReviewEvaluation().final_analysis"></div>
                  </div>

                  <div x-show="attemptReviewEvaluation().candidate_remark" class="border-t border-slate-200/80 pt-4">
                    <div class="text-sm font-semibold text-blue-800">候选人简评</div>
                    <div class="mt-2 max-w-[75ch] whitespace-pre-line text-sm leading-7 text-slate-700 [overflow-wrap:anywhere]" x-text="attemptReviewEvaluation().candidate_remark"></div>
                  </div>

                  <div
                    x-show="assignmentStatusValue(attemptDetail.quiz_paper) === 'grading' && !attemptEvaluationHasContent()"
                    class="grading-placeholder rounded-[1.1rem] border border-dashed border-amber-200 bg-amber-50/70 px-4 py-5"
                  >
                    <div class="grading-placeholder__hero">
                      <div class="grading-placeholder__spinner" aria-hidden="true">
                        <span class="material-symbols-rounded text-[20px]">grading</span>
                      </div>
                      <div>
                        <div class="text-sm font-semibold text-amber-800">正在判卷</div>
                        <p class="mt-2 text-sm leading-6 text-amber-700/90">系统正在汇总题目得分和大模型分析，完成后这里会自动显示总分、主倾向和综合评价。</p>
                      </div>
                    </div>
                    <div class="grading-placeholder__bars" aria-hidden="true">
                      <span class="grading-placeholder__bar grading-placeholder__bar--primary"></span>
                      <span class="grading-placeholder__bar grading-placeholder__bar--secondary"></span>
                      <span class="grading-placeholder__bar grading-placeholder__bar--tertiary"></span>
                    </div>
                  </div>

                  <div
                    x-show="assignmentStatusValue(attemptDetail.quiz_paper) !== 'grading' && !attemptEvaluationHasContent()"
                    class="rounded-[1.1rem] border border-dashed border-slate-200 bg-slate-50/80 px-4 py-5"
                  >
                    <div class="text-sm font-semibold text-slate-700">当前暂无评价摘要</div>
                    <p class="mt-2 text-sm leading-6 text-slate-500">该记录尚未生成可展示的综合分析；如果刚完成判卷，刷新后会自动补齐。</p>
                  </div>
                </div>
              </div>
            </section>
          </div>
