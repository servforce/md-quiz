<div x-show="route.name === 'candidates'" class="admin-candidates-page admin-mobile-pane-grid grid min-h-0 gap-4 xl:items-start xl:grid-cols-[minmax(0,1fr)_22rem] 2xl:grid-cols-[minmax(0,1fr)_24rem]">
  <div
    x-show="shouldShowAdminCompactTabs('candidates')"
    x-cloak
    data-admin-compact-tabs="candidates"
    class="hidden admin-compact-tabs md:block xl:hidden"
  >
    <div class="admin-compact-tabs__track" role="tablist" aria-label="候选人页面内容切换">
      <template x-for="tab in adminCompactTabs('candidates')" :key="tab.id">
        <button
          type="button"
          role="tab"
          @click="setAdminCompactTab('candidates', tab.id)"
          :class="adminCompactTab('candidates') === tab.id ? 'admin-compact-tab--active' : 'admin-compact-tab--inactive'"
          :aria-selected="String(adminCompactTab('candidates') === tab.id)"
          class="admin-compact-tab"
          x-text="tab.label"
        ></button>
      </template>
    </div>
  </div>

  <section
    x-show="adminCompactPanelVisible('candidates', 'list')"
    class="admin-candidate-list admin-surface admin-edge-panel h-auto min-h-0 self-start overflow-hidden rounded-xl"
  >
    <div class="p-4 sm:p-5">
      <h2 class="text-xl font-semibold tracking-[-0.03em] text-slate-900">候选人</h2>
      <p class="mt-1 text-sm text-slate-600">支持搜索、创建、详情查看与简历入库。</p>

      <div class="mt-4 flex min-w-0 flex-wrap items-center gap-2">
        <label x-data="{ composing: false }" class="block min-w-[10rem] flex-[1_1_14rem]">
          <input
            x-model="filters.candidates.q"
            @input="if (!composing) scheduleCandidatesReloadFromFirstPage()"
            @change="reloadCandidatesFromFirstPage({ replace: true })"
            @compositionstart="composing = true"
            @compositionend="composing = false; scheduleCandidatesReloadFromFirstPage()"
            @keydown.enter.prevent="if (!composing) $event.target.blur()"
            aria-label="搜索姓名或手机号"
            class="h-9 w-full rounded-lg border border-blue-100 bg-white px-3 text-xs outline-none transition focus:border-blue-300 focus:ring-2 focus:ring-blue-100"
            placeholder="搜索姓名/手机号"
          />
        </label>
        <div class="grid min-w-0 flex-[1_1_16rem] grid-cols-2 gap-2" role="group" aria-label="创建时间">
          <label class="block min-w-0">
            <input
              type="date"
              x-model="filters.candidates.created_from"
              @change="reloadCandidatesFromFirstPage"
              aria-label="创建时间开始日期"
              class="h-9 min-w-0 w-full rounded-lg border border-blue-100 bg-white px-1.5 text-xs text-slate-700 outline-none transition focus:border-blue-300 focus:ring-2 focus:ring-blue-100"
            />
          </label>
          <label class="block min-w-0">
            <input
              type="date"
              x-model="filters.candidates.created_to"
              @change="reloadCandidatesFromFirstPage"
              aria-label="创建时间结束日期"
              class="h-9 min-w-0 w-full rounded-lg border border-blue-100 bg-white px-1.5 text-xs text-slate-700 outline-none transition focus:border-blue-300 focus:ring-2 focus:ring-blue-100"
            />
          </label>
        </div>
      </div>
    </div>

    <div class="admin-candidate-items divide-y divide-blue-100/70 border-t border-blue-100/70">
      <template x-for="item in candidates.items" :key="item.id">
        <article class="grid gap-3 px-4 py-3 transition hover:bg-blue-50/30 sm:px-5 md:grid-cols-[minmax(9rem,0.75fr)_minmax(0,1.25fr)] md:items-center">
          <div class="min-w-0">
            <div class="flex min-w-0 flex-wrap items-center gap-2">
              <h3 class="min-w-0 text-base font-semibold leading-6 text-slate-900">
                <a :href="'/admin/candidates/' + item.id" @click="go('/admin/candidates/' + item.id, $event)" class="inline-flex min-h-11 items-center rounded-md py-1 underline-offset-4 hover:text-blue-700 hover:underline focus-visible:outline-2 focus-visible:outline-blue-600" x-text="item.name"></a>
              </h3>
              <span x-show="item.has_resume" class="rounded-full border border-emerald-200 bg-emerald-50 px-2 py-0.5 text-[11px] font-semibold text-emerald-700">有简历</span>
            </div>
            <div class="flex flex-wrap items-center gap-x-3 gap-y-1 font-mono text-[11px] leading-5 tabular-nums text-slate-500">
              <span class="text-slate-600" x-text="item.phone"></span>
              <span x-text="formatDateTime(item.created_at)"></span>
            </div>
          </div>
          <div class="min-w-0 divide-y divide-slate-100 rounded-lg border border-slate-200 bg-white/80">
            <template x-for="(summary, index) in candidateAttemptDisplayRows(item)" :key="summary.token || (item.id + '-' + index)">
              <div class="flex min-w-0 flex-wrap items-center justify-between gap-x-3 gap-y-1 px-3 py-1.5">
                <template x-if="candidateAttemptUrl(summary)">
                  <a :href="candidateAttemptUrl(summary)" @click="go(candidateAttemptUrl(summary), $event)" :aria-label="'查看答卷：' + candidateAttemptTitle(summary)" class="inline-flex min-h-11 min-w-0 flex-[1_1_10rem] items-center justify-between gap-2 rounded-md text-sm font-medium text-blue-700 underline-offset-4 hover:underline focus-visible:outline-2 focus-visible:outline-blue-600">
                    <span class="min-w-0 break-words" x-text="candidateAttemptTitle(summary)"></span>
                    <span class="material-symbols-rounded shrink-0 text-base" aria-hidden="true">arrow_outward</span>
                  </a>
                </template>
                <template x-if="!candidateAttemptUrl(summary)">
                  <div class="py-1 text-sm text-slate-600" x-text="candidateAttemptTitle(summary) || '暂无答题记录'"></div>
                </template>
                <div class="flex flex-wrap items-center gap-2">
                  <span :class="candidateAttemptCompletionClass(summary)" x-text="candidateAttemptCompletionLabel(summary)"></span>
                  <span x-show="candidateAttemptShowScore(summary)" class="font-mono text-xs tabular-nums text-slate-600" x-text="candidateAttemptScoreLabel(summary)"></span>
                </div>
              </div>
            </template>
          </div>
        </article>
      </template>
      <div x-show="!(candidates.items || []).length" class="px-4 sm:px-5 py-12 text-center text-sm text-slate-500">
        当前筛选条件下没有候选人
      </div>
    </div>

    <div
      x-show="candidatesHavePagination()"
      class="flex flex-col gap-3 border-t border-blue-100/70 bg-slate-50/45 px-4 sm:px-5 py-3 sm:flex-row sm:items-center sm:justify-between"
    >
      <div class="text-sm text-slate-600 tabular-nums" x-text="'共 ' + (candidates.total || 0) + ' 条 / 第 ' + (candidates.page || 1) + ' 页，共 ' + (candidates.total_pages || 1) + ' 页'"></div>
      <div class="flex flex-wrap items-center gap-2">
        <button
          @click="changeCandidatesPage(1)"
          type="button"
          :disabled="!canGoToPreviousCandidatesPage()"
          :class="candidatePaginationButtonClass(!canGoToPreviousCandidatesPage())"
        >首页</button>
        <button
          @click="changeCandidatesPage(currentCandidatesPage() - 1)"
          type="button"
          :disabled="!canGoToPreviousCandidatesPage()"
          :class="candidatePaginationButtonClass(!canGoToPreviousCandidatesPage())"
        >上一页</button>
        <button
          @click="changeCandidatesPage(currentCandidatesPage() + 1)"
          type="button"
          :disabled="!canGoToNextCandidatesPage()"
          :class="candidatePaginationButtonClass(!canGoToNextCandidatesPage())"
        >下一页</button>
        <button
          @click="changeCandidatesPage(candidateTotalPages())"
          type="button"
          :disabled="!canGoToNextCandidatesPage()"
          :class="candidatePaginationButtonClass(!canGoToNextCandidatesPage())"
        >末页</button>
      </div>
    </div>
  </section>

  <section
    x-show="adminCompactPanelVisible('candidates', 'create')"
    class="admin-candidate-create admin-surface admin-edge-panel admin-right-pane overflow-hidden p-0 rounded-xl"
  >
    <div class="shrink-0 px-4 sm:px-5 py-4 sm:py-5">
      <h2 class="text-xl font-semibold tracking-[-0.03em] text-slate-900">创建候选人</h2>
      <p class="mt-1 text-sm text-slate-600">手动建档，或从简历直接解析入库。</p>
    </div>

    <div class="admin-right-pane__body divide-y divide-blue-100/70 border-t border-blue-100/70">
      <section class="px-4 sm:px-5 py-4 sm:py-5">
        <div class="space-y-4">
          <label class="block">
            <span class="mb-2 block text-xs font-semibold uppercase tracking-[0.18em] text-slate-500">姓名</span>
            <input x-model="candidateForm.name" class="w-full rounded-lg border border-blue-100 bg-white px-4 py-3 text-sm outline-none transition focus:border-blue-300" placeholder="张三" />
          </label>
          <label class="block">
            <span class="mb-2 block text-xs font-semibold uppercase tracking-[0.18em] text-slate-500">手机号</span>
            <input x-model="candidateForm.phone" class="w-full rounded-lg border border-blue-100 bg-white px-4 py-3 text-sm outline-none transition focus:border-blue-300" placeholder="13800138000" />
          </label>
          <label class="block">
            <span class="mb-2 block text-xs font-semibold uppercase tracking-[0.18em] text-slate-500">职位</span>
            <select
              x-model="candidateForm.job_description_id"
              class="w-full rounded-lg border border-blue-100 bg-white px-4 py-3 text-sm outline-none transition focus:border-blue-300"
            >
              <option value="" disabled hidden>请选择职位</option>
              <template x-for="item in candidateJobDescriptionOptions" :key="item.id">
                <option :value="item.id" x-text="jobDescriptionOptionLabel(item)"></option>
              </template>
            </select>
          </label>
          <button @click="createCandidate" type="button" class="inline-flex items-center gap-2 rounded-lg bg-blue-600 px-4 py-3 text-sm font-semibold text-white transition hover:bg-blue-700">
            <span class="material-symbols-rounded text-base">person_add</span>
            创建候选人
          </button>
        </div>
      </section>

      <section class="px-4 sm:px-5 py-4 sm:py-5">
        <div class="flex flex-wrap items-start justify-between gap-3">
          <div>
            <div class="text-sm font-semibold text-slate-900">从简历直接入库</div>
            <p class="mt-1 text-sm leading-6 text-slate-600">先手动选择职位，再上传简历。系统会自动解析手机号并创建或更新候选人。</p>
          </div>
          <div class="group relative inline-flex w-auto shrink-0 self-start">
            <button
              @click="openCandidateResumeUploadPicker"
              type="button"
              :disabled="candidateResumeUploadState.busy || !selectedResumeUploadJobDescriptionId()"
              class="inline-flex w-auto items-center justify-center gap-2 whitespace-nowrap rounded-lg border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm font-semibold text-emerald-700 transition hover:bg-emerald-100 disabled:cursor-not-allowed disabled:opacity-70"
            >
              <span
                class="material-symbols-rounded text-base"
                :class="candidateResumeUploadState.busy ? 'animate-spin' : ''"
                x-text="candidateResumeUploadState.busy ? 'progress_activity' : 'upload_file'"
              ></span>
              <span x-text="candidateResumeUploadState.busy ? '解析中...' : '选择简历'"></span>
            </button>
            <div
              x-show="!candidateResumeUploadState.busy && !selectedResumeUploadJobDescriptionId()"
              x-cloak
              class="pointer-events-none absolute right-0 top-full z-30 mt-2 w-48 rounded-xl border border-blue-100 bg-white px-3 py-2 text-xs leading-5 text-slate-600 opacity-0 shadow-[var(--admin-shadow)] transition group-hover:opacity-100"
            >
              选择职位后上传
            </div>
          </div>
        </div>
        <label class="mt-4 block">
          <span class="mb-2 block text-xs font-semibold uppercase tracking-[0.18em] text-slate-500">简历入库职位</span>
          <select
            x-model="candidateResumeUploadForm.job_description_id"
            class="w-full rounded-lg border border-blue-100 bg-white px-4 py-3 text-sm outline-none transition focus:border-blue-300"
          >
            <option value="" disabled hidden>请选择职位</option>
            <template x-for="item in candidateJobDescriptionOptions" :key="item.id">
              <option :value="item.id" x-text="jobDescriptionOptionLabel(item)"></option>
            </template>
          </select>
        </label>
        <input
          x-ref="candidateResumeUpload"
          aria-label="选择要导入的简历文件"
          @change="handleCandidateResumeUploadSelected($event)"
          type="file"
          accept=".pdf,.png,.jpg,.jpeg,.webp,.bmp,.tif,.tiff"
          class="sr-only"
        />

        <div class="mt-4 border-t border-blue-100/70 pt-4">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div class="text-xs font-semibold uppercase tracking-[0.18em] text-slate-500">当前状态</div>
            <span
              class="inline-flex items-center rounded-full border px-2.5 py-1 text-[11px] font-semibold"
              :style="resumeStateBadgeStyle(candidateResumeUploadState.phase)"
              x-text="resumeStateLabel(candidateResumeUploadState.phase)"
            ></span>
          </div>
          <div class="mt-3 grid gap-3 sm:grid-cols-[minmax(0,1fr)_auto] sm:items-start">
            <div class="min-w-0">
              <div class="text-sm font-medium text-slate-700" x-text="candidateResumeUploadState.message"></div>
              <div class="mt-2 break-all text-xs leading-5 text-slate-500">
                <span class="font-semibold text-slate-600">本次文件：</span>
                <span x-text="candidateResumeUploadState.fileName || '未选择文件'"></span>
              </div>
              <div x-show="candidateResumeUploadState.created !== null" class="mt-2 text-xs leading-5 text-slate-500">
                <span class="font-semibold text-slate-600">处理结果：</span>
                <span x-text="candidateResumeUploadState.created ? '已创建候选人' : '已更新候选人'"></span>
                <span x-show="candidateResumeUploadState.candidateName" x-text="' · ' + candidateResumeUploadState.candidateName"></span>
              </div>
              <p x-show="candidateResumeUploadState.error" class="mt-2 text-xs leading-5 text-rose-600" x-text="candidateResumeUploadState.error"></p>
            </div>
            <div class="rounded-full bg-slate-100 px-3 py-1.5 text-xs font-medium text-slate-500">
              支持 PDF / 图片
            </div>
          </div>
        </div>
      </section>
    </div>
  </section>
</div>
