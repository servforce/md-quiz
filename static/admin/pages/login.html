<section class="mx-auto flex min-h-[calc(100dvh-2rem)] w-full max-w-5xl items-center px-1 py-6 sm:px-4">
  <div class="grid w-full overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm md:grid-cols-[1.1fr_1fr]">
    <div class="flex flex-col justify-between border-b border-slate-200 bg-slate-50 px-6 py-7 sm:px-9 md:border-b-0 md:border-r md:py-12">
      <div><div class="flex items-center gap-3"><img src="/static/logo.svg" alt="" aria-hidden="true" class="h-9 w-9" /><span class="text-xl font-bold tracking-tight text-slate-900">MD Quiz</span></div><h1 class="mt-8 text-3xl font-semibold leading-tight tracking-tight text-slate-900 sm:text-4xl">让每次测评，<br />都有据可查。</h1><p class="mt-4 max-w-sm text-sm leading-7 text-slate-600">管理测验版本、参与者资料与答卷结果，连接招聘、培训和考核中的每一步。</p></div>
      <div class="mt-7 hidden border-t border-slate-200 pt-6 md:block"><p class="text-xs font-medium text-slate-500">从准备到复核</p><p class="mt-3 text-sm font-medium text-slate-700">同步测验 <span class="mx-2 text-slate-400">→</span> 发出邀约 <span class="mx-2 text-slate-400">→</span> 查看结果</p></div>
    </div>
    <form @submit.prevent="login" class="flex flex-col justify-center px-6 py-8 sm:px-9 md:py-12">
      <h2 class="text-2xl font-semibold tracking-tight text-slate-900">管理员登录</h2><p class="mt-2 text-sm text-slate-500">使用管理员账号进入工作台。</p>
      <div class="mt-7 space-y-5">
        <label class="block"><span class="mb-2 block text-sm font-medium text-slate-700">账号</span><input x-model="loginForm.username" autocomplete="username" required class="min-h-12 w-full rounded-lg border border-slate-200 bg-white px-4 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100" placeholder="请输入管理员账号" /></label>
        <label class="block"><span class="mb-2 block text-sm font-medium text-slate-700">密码</span><input x-model="loginForm.password" type="password" autocomplete="current-password" required class="min-h-12 w-full rounded-lg border border-slate-200 bg-white px-4 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100" placeholder="请输入管理员密码" /></label>
      </div>
      <p x-show="error" role="alert" class="mt-5 rounded-lg border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-700" x-text="error"></p>
      <button type="submit" class="mt-6 min-h-12 w-full rounded-lg bg-blue-600 px-4 text-sm font-semibold text-white transition hover:bg-blue-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600">登录后台</button>
    </form>
  </div>
</section>
