<div x-show="route.name === 'job-descriptions'" class="admin-job-description-page admin-mobile-pane-grid grid min-h-0 gap-4 xl:grid-cols-[25rem_minmax(0,1fr)]">
  <div
    x-show="shouldShowAdminCompactTabs('job-descriptions')"
    x-cloak
    data-admin-compact-tabs="job-descriptions"
    class="hidden admin-compact-tabs md:block xl:hidden"
  >
    <div class="admin-compact-tabs__track" role="tablist" aria-label="职位页面内容切换">
      <template x-for="tab in adminCompactTabs('job-descriptions')" :key="tab.id">
        <button
          type="button"
          role="tab"
          @click="setAdminCompactTab('job-descriptions', tab.id)"
          :class="adminCompactTab('job-descriptions') === tab.id ? 'admin-compact-tab--active' : 'admin-compact-tab--inactive'"
          :aria-selected="String(adminCompactTab('job-descriptions') === tab.id)"
          class="admin-compact-tab"
          x-text="tab.label"
        ></button>
      </template>
    </div>
  </div>

  <section
    x-show="adminCompactPanelVisible('job-descriptions', 'list')"
    class="admin-job-description-list admin-surface admin-edge-panel overflow-hidden rounded-3xl border border-white/70 bg-white/82 shadow-[var(--admin-shadow)] backdrop-blur-xl"
  >
    <div class="shrink-0 flex flex-col gap-3 px-5 py-4 lg:flex-row lg:items-center lg:justify-between">
      <div>
        <h2 class="text-xl font-semibold tracking-[-0.03em] text-slate-900">职位列表</h2>
        <p class="mt-1 text-sm text-slate-600">管理岗位说明、任职要求与面试侧重点。</p>
      </div>
      <button
        @click="startCreateJobDescription"
        type="button"
        class="inline-flex shrink-0 items-center justify-center gap-2 rounded-lg bg-blue-600 px-4 py-3 text-sm font-semibold text-white transition hover:bg-blue-700"
      >
        <span class="material-symbols-rounded text-base">add</span>
        新建职位
      </button>
    </div>

    <div class="shrink-0 grid gap-3 border-t border-blue-100/70 px-5 py-4 lg:grid-cols-[minmax(0,1fr)_10rem]">
      <div x-data="{ composing: false }" class="min-w-0">
        <input
          x-model="filters.jobDescriptions.q"
          @input="if (!composing) scheduleJobDescriptionsReloadFromFirstPage()"
          @change="reloadJobDescriptionsFromFirstPage"
          @compositionstart="composing = true"
          @compositionend="composing = false; scheduleJobDescriptionsReloadFromFirstPage()"
          @keydown.enter.prevent="if (!composing) $event.target.blur()"
          class="min-w-0 w-full rounded-lg border border-blue-100 bg-white px-4 py-2.5 text-sm outline-none transition focus:border-blue-300"
          placeholder="搜索岗位名称 / 内容 / ID"
        />
      </div>
      <select
        x-model="filters.jobDescriptions.status"
        @change="reloadJobDescriptionsFromFirstPage"
        class="w-full rounded-lg border border-blue-100 bg-white px-3 py-2.5 text-sm outline-none transition focus:border-blue-300"
      >
        <option value="">全部状态</option>
        <template x-for="option in jobDescriptionStatusOptions()" :key="option.key">
          <option :value="option.key" x-text="option.label"></option>
        </template>
      </select>
    </div>

    <div class="admin-job-description-items divide-y divide-blue-100/70 border-t border-blue-100/70">
      <template x-for="item in jobDescriptions.items" :key="item.id">
        <button
          type="button"
          @click="loadJobDescription(item.id)"
          :class="Number(jobDescriptionForm.id || 0) === Number(item.id || 0) ? 'bg-blue-50/70' : 'hover:bg-blue-50/45'"
          class="group w-full px-5 py-4 text-left transition focus:outline-none focus-visible:bg-blue-50/80"
        >
          <div class="flex flex-col gap-2 sm:flex-row sm:items-start sm:justify-between">
            <div class="min-w-0">
              <div class="flex min-w-0 flex-wrap items-center gap-2">
                <span class="truncate text-lg font-semibold leading-6 text-slate-900 transition group-hover:text-blue-700" x-text="item.title || ('职位 #' + item.id)"></span>
                <span :class="jobDescriptionStatusBadgeClass(item.status)" x-text="item.status_label || jobDescriptionStatusLabel(item.status)"></span>
                <span :class="jobDescriptionSourceBadgeClass(item.source_kind)" x-text="item.source_label || jobDescriptionSourceLabel(item.source_kind)"></span>
              </div>
              <div x-show="item.source_path" class="mt-1 truncate font-mono text-[11px] leading-5 text-slate-400" x-text="item.source_path"></div>
            </div>
            <div class="shrink-0 text-left sm:text-right">
              <div class="font-mono text-[11px] leading-5 tabular-nums text-slate-400" x-text="formatDateTime(item.updated_at)"></div>
              <div class="mt-1 font-mono text-[11px] leading-5 text-slate-400" x-text="'#' + item.id"></div>
            </div>
          </div>
        </button>
      </template>
      <div x-show="!(jobDescriptions.items || []).length" class="px-5 py-12 text-center text-sm text-slate-500">
        当前筛选条件下没有职位
      </div>
    </div>

    <div
      x-show="jobDescriptionsHavePagination()"
      class="shrink-0 flex flex-col gap-3 border-t border-blue-100/70 bg-slate-50/45 px-5 py-3 sm:flex-row sm:items-center sm:justify-between"
    >
      <div class="text-sm text-slate-600 tabular-nums" x-text="'共 ' + (jobDescriptions.total || 0) + ' 条 / 第 ' + (jobDescriptions.page || 1) + ' 页，共 ' + (jobDescriptions.total_pages || 1) + ' 页'"></div>
      <div class="flex flex-wrap items-center gap-2">
        <button
          @click="changeJobDescriptionsPage(1)"
          type="button"
          :disabled="!canGoToPreviousJobDescriptionsPage()"
          :class="jobDescriptionPaginationButtonClass(!canGoToPreviousJobDescriptionsPage())"
        >首页</button>
        <button
          @click="changeJobDescriptionsPage(currentJobDescriptionsPage() - 1)"
          type="button"
          :disabled="!canGoToPreviousJobDescriptionsPage()"
          :class="jobDescriptionPaginationButtonClass(!canGoToPreviousJobDescriptionsPage())"
        >上一页</button>
        <button
          @click="changeJobDescriptionsPage(currentJobDescriptionsPage() + 1)"
          type="button"
          :disabled="!canGoToNextJobDescriptionsPage()"
          :class="jobDescriptionPaginationButtonClass(!canGoToNextJobDescriptionsPage())"
        >下一页</button>
        <button
          @click="changeJobDescriptionsPage(jobDescriptionTotalPages())"
          type="button"
          :disabled="!canGoToNextJobDescriptionsPage()"
          :class="jobDescriptionPaginationButtonClass(!canGoToNextJobDescriptionsPage())"
        >末页</button>
      </div>
    </div>
  </section>

  <section
    x-show="adminCompactPanelVisible('job-descriptions', 'editor')"
    class="admin-job-description-editor admin-surface admin-edge-panel admin-right-pane flex min-h-0 flex-col rounded-3xl border border-white/70 bg-white/82 shadow-[var(--admin-shadow)] backdrop-blur-xl md:max-xl:h-[calc(100dvh-2.5rem)] md:max-xl:max-h-[calc(100dvh-2.5rem)]"
  >
    <div class="shrink-0 flex flex-col gap-2 px-5 py-3 lg:flex-row lg:items-center lg:justify-between">
      <div class="min-w-0">
        <h2 class="text-lg font-semibold leading-6 tracking-[-0.02em] text-slate-900" x-text="jobDescriptionEditorTitle()"></h2>
        <div class="mt-0.5 flex flex-wrap items-center gap-1.5 text-xs text-slate-500">
          <span x-show="jobDescriptionForm.id" class="font-mono text-[11px]" x-text="'#' + jobDescriptionForm.id"></span>
          <span x-show="jobDescriptionForm.id" :class="jobDescriptionSourceBadgeClass(jobDescriptionForm.source_kind)" x-text="jobDescriptionSourceLabel(jobDescriptionForm.source_kind)"></span>
          <span x-show="jobDescriptionDetail.updated_at" class="font-mono text-[11px] tabular-nums" x-text="formatDateTime(jobDescriptionDetail.updated_at)"></span>
          <span x-show="jobDescriptionFormDirty()" class="rounded-full border border-amber-200 bg-amber-50 px-2 py-0.5 text-[11px] font-semibold text-amber-700">未保存</span>
        </div>
        <div x-show="jobDescriptionForm.source_path" class="mt-1 flex flex-wrap items-center gap-1.5 text-[11px] text-slate-500">
          <span class="font-mono" x-text="jobDescriptionForm.jd_key"></span>
          <span class="font-mono" x-text="jobDescriptionForm.source_path"></span>
          <span x-show="jobDescriptionDetail.last_sync_at" class="font-mono tabular-nums" x-text="'sync ' + formatDateTime(jobDescriptionDetail.last_sync_at)"></span>
          <span x-show="jobDescriptionDetail.last_sync_error" class="rounded-full border border-rose-200 bg-rose-50 px-2 py-0.5 font-semibold text-rose-700" x-text="jobDescriptionDetail.last_sync_error"></span>
        </div>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <button
          @click="saveJobDescription"
          type="button"
          :disabled="jobDescriptionReadOnly()"
          :class="jobDescriptionReadOnly() ? 'cursor-not-allowed opacity-45' : ''"
          class="inline-flex h-9 items-center gap-1.5 rounded-lg bg-blue-600 px-3 text-sm font-semibold text-white transition hover:bg-blue-700"
        >
          <span class="material-symbols-rounded text-base">save</span>
          保存
        </button>
        <button
          x-show="jobDescriptionForm.id"
          @click="deleteJobDescription"
          type="button"
          :disabled="jobDescriptionReadOnly()"
          :class="jobDescriptionReadOnly() ? 'cursor-not-allowed opacity-45' : ''"
          class="inline-flex h-9 items-center gap-1.5 rounded-lg border border-rose-200 bg-rose-50 px-3 text-sm font-semibold text-rose-700 transition hover:bg-rose-100"
        >
          <span class="material-symbols-rounded text-base">delete</span>
          删除
        </button>
      </div>
    </div>

    <div class="flex min-h-0 flex-col divide-y divide-blue-100/70 border-t border-blue-100/70">
      <section class="shrink-0 px-5 py-2">
        <div class="grid gap-2 lg:grid-cols-[minmax(0,1fr)_10rem]">
          <label class="block min-w-0">
            <span class="mb-1 block text-[11px] font-semibold uppercase tracking-[0.14em] text-slate-500">岗位名称</span>
            <input
              x-model="jobDescriptionForm.title"
              :disabled="jobDescriptionReadOnly()"
              class="min-w-0 w-full rounded-lg border border-blue-100 bg-white px-3 py-2 text-sm outline-none transition focus:border-blue-300"
              placeholder="高级后端工程师"
            />
          </label>
          <label class="block">
            <span class="mb-1 flex items-center gap-1 text-[11px] font-semibold uppercase tracking-[0.14em] text-slate-500">
              <span>状态</span>
              <span class="group relative inline-flex">
                <span
                  tabindex="0"
                  role="img"
                  aria-label="查看状态说明"
                  class="inline-flex h-3.5 w-3.5 items-center justify-center rounded-full border border-slate-300 bg-white/70 text-[10px] font-semibold leading-none text-slate-400 outline-none transition hover:border-slate-400 hover:text-slate-500 focus-visible:ring-2 focus-visible:ring-blue-100"
                >?</span>
                <span
                  class="pointer-events-none absolute right-0 top-6 z-30 w-72 rounded-xl border border-blue-100 bg-white px-4 py-3 text-left text-xs font-normal normal-case leading-5 tracking-normal text-slate-600 opacity-0 shadow-[var(--admin-shadow)] transition group-hover:opacity-100 group-focus-within:opacity-100"
                >
                  草稿：编写中，暂不作为正式岗位使用。<br />
                  启用：当前有效职位，可用于后续业务引用。<br />
                  归档：历史职位，不再作为当前岗位使用。
                </span>
              </span>
            </span>
            <select
              x-model="jobDescriptionForm.status"
              :disabled="jobDescriptionReadOnly()"
              class="w-full rounded-lg border border-blue-100 bg-white px-3 py-2 text-sm outline-none transition focus:border-blue-300"
            >
              <template x-for="option in jobDescriptionStatusOptions()" :key="option.key">
                <option :value="option.key" x-text="option.label"></option>
              </template>
            </select>
          </label>
        </div>
        <div x-data="{ adding: false, query: '' }" class="mt-2 border-t border-blue-100/70 pt-2">
          <div class="flex flex-wrap items-center gap-2">
            <span class="text-[11px] font-semibold uppercase tracking-[0.14em] text-slate-500">关联试题</span>
          </div>

          <div class="mt-2 grid gap-2 sm:grid-cols-2 xl:grid-cols-3">
            <template x-for="quiz in jobDescriptionRelatedQuizItems()" :key="quiz.quiz_key">
              <article class="min-w-0 rounded-lg border border-blue-100 bg-white/80 px-3 py-2 text-sm text-slate-700">
                <div class="flex items-start justify-between gap-2">
                  <span class="min-w-0">
                    <span class="block truncate font-medium" x-text="quiz.title"></span>
                    <span class="mt-0.5 block truncate font-mono text-[11px] text-slate-400" x-text="quiz.quiz_key"></span>
                  </span>
                  <button
                    type="button"
                    @click="removeJobDescriptionRelatedQuiz(quiz.quiz_key)"
                    :disabled="jobDescriptionReadOnly()"
                    :class="jobDescriptionReadOnly() ? 'cursor-not-allowed opacity-45' : ''"
                    class="inline-flex h-6 w-6 shrink-0 items-center justify-center rounded-md border border-slate-200 bg-slate-50 text-slate-400 transition"
                    :aria-label="'移除试题：' + quiz.title"
                    title="移除试题"
                  >
                    <span class="material-symbols-rounded text-base">close</span>
                  </button>
                </div>
              </article>
            </template>

            <button
              x-show="!adding"
              type="button"
              @click="adding = true"
              :disabled="jobDescriptionReadOnly()"
              :class="jobDescriptionReadOnly() ? 'cursor-not-allowed opacity-45' : ''"
              class="inline-flex items-center justify-center rounded-lg border border-dashed border-blue-200 bg-white/55 py-6 text-blue-600 transition"
              aria-label="添加关联试题"
              title="添加关联试题"
            >
              <span class="material-symbols-rounded text-xl">add</span>
            </button>

            <article
              x-show="adding"
              x-transition.opacity.duration.150ms
              @keydown.escape.prevent="adding = false; query = ''"
              class="min-w-0 rounded-lg border border-blue-100 bg-blue-50/50 px-3 py-2"
            >
              <input
                x-model="query"
                @blur="adding = false; query = ''"
                :disabled="jobDescriptionReadOnly()"
                class="min-w-0 w-full rounded-lg border border-blue-100 bg-white px-3 py-2 text-sm outline-none transition focus:border-blue-300"
                placeholder="输入试题名称或 ID"
                aria-label="搜索要关联的试题"
              />
              <div x-show="query.trim()" class="mt-2 overflow-hidden rounded-lg border border-blue-100 bg-white">
                <template x-for="quiz in jobDescriptionRelatedQuizSearchResults(query)" :key="quiz.quiz_key">
                  <div class="grid grid-cols-[minmax(0,1fr)_3rem] items-center gap-2 border-b border-blue-100/70 px-3 py-2">
                    <span class="min-w-0">
                      <span class="block truncate text-sm font-medium text-slate-700" x-text="quiz.title || quiz.quiz_key"></span>
                      <span class="mt-0.5 block truncate font-mono text-[11px] text-slate-400" x-text="quiz.quiz_key"></span>
                    </span>
                    <button
                      type="button"
                      @mousedown.prevent
                      @click="addJobDescriptionRelatedQuiz(quiz.quiz_key); query = ''"
                      :disabled="jobDescriptionReadOnly()"
                      :class="jobDescriptionReadOnly() ? 'cursor-not-allowed opacity-45' : ''"
                      class="inline-flex h-8 w-8 items-center justify-center rounded-md border border-blue-100 bg-blue-50 text-blue-600"
                      :aria-label="'添加试题：' + (quiz.title || quiz.quiz_key)"
                      title="添加试题"
                    >
                      <span class="material-symbols-rounded text-base">add</span>
                    </button>
                  </div>
                </template>
                <div
                  x-show="!jobDescriptionRelatedQuizSearchResults(query).length"
                  class="px-3 py-2 text-sm text-slate-500"
                >未找到可添加的试题</div>
              </div>
            </article>
          </div>

          <div x-show="!jobDescriptionRelatedQuizOptions().length" class="mt-2 rounded-lg border border-dashed border-slate-200 px-3 py-2 text-sm text-slate-500">
            暂无可关联试题
          </div>
        </div>
      </section>

      <section class="flex min-h-[28rem] flex-col">
        <div class="flex shrink-0 flex-wrap items-center justify-between gap-3 px-5 py-2">
          <div class="inline-flex rounded-lg border border-blue-100 bg-white/80 p-0.5" role="tablist" aria-label="职位内容视图">
            <template x-for="tab in jobDescriptionContentTabs()" :key="tab.key">
              <button
                type="button"
                role="tab"
                @click="setJobDescriptionContentTab(tab.key)"
                :class="jobDescriptionContentTabClass(tab.key)"
                :aria-selected="String((jobDescriptionContentTab || 'preview') === tab.key)"
                x-text="tab.label"
              ></button>
            </template>
          </div>
        </div>

        <div class="border-t border-blue-100/70">
          <textarea
            x-show="(jobDescriptionContentTab || 'preview') === 'edit'"
            x-ref="jobDescriptionContentEditor"
            x-model="jobDescriptionForm.content_md"
            x-init="$nextTick(() => autosizeJobDescriptionEditor($el))"
            @input="autosizeJobDescriptionEditor($event.target)"
            :readonly="jobDescriptionReadOnly()"
            spellcheck="false"
            class="block min-h-[28rem] w-full resize-none overflow-hidden border-0 bg-slate-50/70 px-5 py-4 font-mono text-sm leading-6 text-slate-700 outline-none transition placeholder:text-slate-400 focus:bg-white"
            placeholder="# 岗位职责&#10;&#10;- 负责核心服务设计与实现&#10;- 参与系统稳定性建设&#10;&#10;## 任职要求&#10;&#10;- 熟悉 Python / Web API / PostgreSQL"
          ></textarea>

          <div
            x-show="(jobDescriptionContentTab || 'preview') === 'preview'"
            class="min-h-[28rem] bg-white/50 px-5 py-4"
          >
            <div
              x-show="jobDescriptionPreviewHtml()"
              class="quiz-rich admin-markdown text-sm leading-6 text-slate-800"
              x-html="jobDescriptionPreviewHtml()"
            ></div>
            <div x-show="!jobDescriptionPreviewHtml()" class="grid min-h-64 place-items-center text-center text-sm text-slate-500">
              保存后显示 Markdown 预览
            </div>
          </div>
        </div>
      </section>
    </div>
  </section>
</div>
