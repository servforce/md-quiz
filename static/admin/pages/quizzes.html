<div x-show="route.name === 'quizzes'" class="space-y-4">

                    ></button>
                  </template>
                </div>
              </div>

              <section

                <div class="flex flex-wrap items-start justify-between gap-4">
                  <div>
                    <h2 class="text-xl font-semibold tracking-[-0.03em] text-slate-900">测验列表</h2>

                        id="quiz-list-sort"

                        @change="reloadQuizzesFromFirstPage"
                        class="h-10 min-w-0 rounded-lg border border-blue-100 bg-white px-3 py-0 text-sm font-normal text-slate-700 outline-none transition focus:border-blue-300"

                        <option value="respondent_count">答题人数</option>
                      </select>
                      <button

                        @click="toggleQuizSortOrder"

                      >
                        <span class="font-normal leading-none" x-text="filters.quizzes.sortOrder === 'asc' ? '↑' : '↓'"></span>
                        <span class="font-normal" x-text="filters.quizzes.sortOrder === 'asc' ? '正序' : '倒序'"></span>
                      </button>
                    </div>
                    <label class="min-w-0">
                      <span class="sr-only">公开邀约</span>
                      <select x-model="filters.quizzes.public_invite" @change="reloadQuizzesFromFirstPage" class="h-10 max-w-full rounded-lg border border-blue-100 bg-white px-3 text-sm text-slate-700 outline-none focus:border-blue-300">
                        <option value="">全部公开状态</option>
                        <option value="enabled">已开放公开邀约</option>
                        <option value="disabled">未开放公开邀约</option>
                      </select>
                    </label>
                    <div x-data="{ composing: false }" class="min-w-[10rem] flex-[1_1_12rem]">
                      <input
                        x-model="filters.quizzes.q"
                        @input.debounce.220ms="if (!composing) reloadQuizzesFromFirstPage({ replace: true })"
                        @compositionstart="composing = true"
                        @compositionend="composing = false; reloadQuizzesFromFirstPage({ replace: true })"
                        aria-label="搜索测验标题、编号或标签"
                        @keydown.enter.prevent="if (!composing) $event.target.blur()"
                        class="min-w-0 w-full rounded-lg border border-blue-100 bg-white px-4 py-2.5 text-sm outline-none focus:border-blue-300"
                        placeholder="搜索标题 / ID / tags"
                      />
                    </div>
                  </div>
                </div>
                <div class="-mx-4 mt-4 divide-y divide-slate-100 border-y border-slate-100 sm:-mx-5" role="list" aria-label="测验列表">
                  <template x-for="item in quizzes.items" :key="item.quiz_key">
                    <article class="grid min-w-0 gap-2 px-4 py-3 sm:px-5 @min-[28rem]/quizzes:grid-cols-2 @min-[52rem]/quizzes:grid-cols-[minmax(0,1.5fr)_minmax(0,1fr)_minmax(0,1fr)] @min-[52rem]/quizzes:items-center" role="listitem">
                      <div class="min-w-0">
                        <a :href="'/admin/quizzes/' + encodeURIComponent(item.quiz_key)" @click="go($el.href, $event)" class="block text-base font-semibold leading-6 text-slate-900 [overflow-wrap:anywhere] hover:text-blue-700 focus-visible:outline-2 focus-visible:outline-blue-500" x-text="item.title || item.quiz_key"></a>
                        <div class="mt-1 break-all font-mono text-[11px] text-slate-500" x-text="item.quiz_key"></div>
                        <div x-show="(item.tags || []).length" :title="(item.tags || []).join(' · ')" class="mt-1 truncate text-xs text-slate-500" x-text="(item.tags || []).join(' · ')"></div>
                      </div>
                      <div class="flex min-w-0 flex-wrap items-center gap-x-3 gap-y-1 text-xs leading-6 text-slate-600">
                        <span>题目 <strong class="tabular-nums" x-text="item.question_count"></strong></span>
                        <span :class="filters.quizzes.sortBy === 'respondent_count' ? 'text-blue-700' : ''">答题人数 <strong class="tabular-nums" x-text="item.respondent_count || 0"></strong></span>
                        <span>预计 <strong class="tabular-nums" x-text="item.estimated_duration_minutes || 0"></strong> 分钟</span>
                        <span>版本 <strong class="tabular-nums" x-text="item.current_version_no || '-'"></strong></span>
                      </div>
                      <div class="min-w-0 @min-[28rem]/quizzes:col-span-2 @min-[52rem]/quizzes:col-span-1">
                        <div class="flex flex-wrap items-center gap-1.5 text-[11px]">
                          <span class="rounded-full border border-slate-200 bg-slate-50 px-2 py-0.5 text-slate-600" x-text="item.status"></span>
                          <span class="rounded-full border px-2 py-0.5" :class="item.public_invite_enabled ? 'border-emerald-200 bg-emerald-50 text-emerald-700' : 'border-slate-200 text-slate-500'" x-text="item.public_invite_enabled ? '公开邀约已开放' : '公开邀约未开放'"></span>
                        </div>
                        <time class="mt-1 block text-[11px] leading-5 tabular-nums" :class="filters.quizzes.sortBy === 'updated_at' ? 'text-blue-700' : 'text-slate-500'" x-text="'更新 ' + (formatDateTime(item.updated_at) || '-')"></time>
                        <p x-show="item.last_sync_error" class="mt-1 text-xs text-rose-700 [overflow-wrap:anywhere]" x-text="item.last_sync_error"></p>
                      </div>
                    </article>
                  </template>
                  <div x-show="!(quizzes.items || []).length" class="px-4 py-10 text-center text-sm text-slate-500">当前筛选条件下没有测验</div>
                </div>
                <div class="flex flex-wrap items-center justify-between gap-3 pt-4">
                  <p class="text-xs tabular-nums text-slate-500" x-text="'共 ' + (quizzes.total || 0) + ' 条 · 第 ' + currentQuizzesPage() + ' / ' + quizTotalPages() + ' 页'"></p>
                  <div class="flex flex-wrap gap-2" aria-label="测验分页">
                    <button type="button" @click="changeQuizzesPage(1)" :disabled="currentQuizzesPage() <= 1" class="rounded-lg border border-slate-200 px-3 py-2 text-xs text-slate-700 hover:bg-blue-50 disabled:cursor-not-allowed disabled:opacity-40">首页</button>
                    <button type="button" @click="changeQuizzesPage(currentQuizzesPage() - 1)" :disabled="currentQuizzesPage() <= 1" class="rounded-lg border border-slate-200 px-3 py-2 text-xs text-slate-700 hover:bg-blue-50 disabled:cursor-not-allowed disabled:opacity-40">上一页</button>
                    <button type="button" @click="changeQuizzesPage(currentQuizzesPage() + 1)" :disabled="currentQuizzesPage() >= quizTotalPages()" class="rounded-lg border border-slate-200 px-3 py-2 text-xs text-slate-700 hover:bg-blue-50 disabled:cursor-not-allowed disabled:opacity-40">下一页</button>
                    <button type="button" @click="changeQuizzesPage(quizTotalPages())" :disabled="currentQuizzesPage() >= quizTotalPages()" class="rounded-lg border border-slate-200 px-3 py-2 text-xs text-slate-700 hover:bg-blue-50 disabled:cursor-not-allowed disabled:opacity-40">末页</button>
                  </div>
                </div>
              </section>

              <section
                x-show="adminCompactPanelVisible('quizzes', 'repo')"
                class="admin-surface admin-right-pane rounded-xl p-4 sm:p-5"
              >
                <h2 class="text-xl font-semibold tracking-[-0.03em] text-slate-900">绑定仓库</h2>
                <p class="mt-1 text-sm text-slate-600">每套实例只绑定一个 Git 仓库；首次绑定后自动同步，后续同步仅针对当前绑定仓库执行。</p>

                <div class="admin-right-pane__body">
                  <div x-show="!hasRepoBinding()" class="mt-4">
                    <label class="block">
                    <span class="mb-2 block text-xs font-semibold uppercase tracking-[0.18em] text-slate-500">仓库地址</span>
                    <div class="flex items-center gap-0 overflow-hidden rounded-lg border border-blue-100 bg-white">
                      <input
                        x-model="syncForm.repoUrl"
                        :readonly="isSyncBusy()"
                        :aria-readonly="isSyncBusy() ? 'true' : 'false'"
                        class="min-w-0 flex-1 bg-transparent px-4 py-3 text-sm outline-none"
                        :style="isSyncBusy() ? 'color:#64748b;' : ''"
                        placeholder="https://example.com/repo.git"
                      />
                      <button
                        @click="bindRepo"
                        type="button"
                        :disabled="isSyncBusy()"
                        class="inline-flex shrink-0 items-center gap-2 bg-slate-900 px-4 py-3 text-sm font-medium text-white transition hover:bg-slate-800"
                        :style="isSyncBusy() ? 'opacity:0.72; cursor:not-allowed; border-top-right-radius: 0.5rem; border-bottom-right-radius: 0.5rem;' : 'border-top-right-radius: 0.5rem; border-bottom-right-radius: 0.5rem;'"
                      >
                        <span class="material-symbols-rounded text-base">link</span>
                        <span>绑定并同步</span>
                      </button>
                    </div>
                    </label>
                  </div>

                <div x-show="hasRepoBinding()" class="mt-4 space-y-4">
                  <div>
                    <div class="mb-2 block text-xs font-semibold uppercase tracking-[0.18em] text-slate-500">当前绑定仓库</div>
                    <div class="flex items-center gap-0 overflow-hidden rounded-lg border border-blue-100 bg-white">
                      <input
                        :value="repoBinding.repo_url || ''"
                        readonly
                        aria-readonly="true"
                        class="min-w-0 flex-1 bg-transparent px-4 py-3 text-sm text-slate-700 outline-none"
                      />
                      <button
                        @click="syncQuizzes"
                        type="button"
                        :disabled="isSyncBusy()"
                        class="inline-flex shrink-0 items-center gap-2 bg-slate-900 px-4 py-3 text-sm font-medium text-white transition hover:bg-slate-800"
                        :style="isSyncBusy() ? 'opacity:0.72; cursor:not-allowed; border-top-right-radius: 0.5rem; border-bottom-right-radius: 0.5rem;' : 'border-top-right-radius: 0.5rem; border-bottom-right-radius: 0.5rem;'"
                      >
                        <span class="material-symbols-rounded text-base" x-text="isSyncBusy() ? 'progress_activity' : 'sync'"></span>
                        <span x-text="isSyncBusy() ? '同步中' : '立即同步'"></span>
                      </button>
                    </div>
                    <div class="mt-2 text-xs text-slate-500" x-show="repoBinding.bound_at">
                      绑定时间：<span x-text="formatDateTime(repoBinding.bound_at)"></span>
                    </div>
                  </div>

                  <div class="rounded-2xl border border-rose-100 bg-rose-50/70 p-4">
                    <div class="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
                      <div>
                        <div class="text-sm font-semibold text-rose-700">重新绑定仓库</div>
                        <p class="mt-1 text-xs leading-6 text-rose-600">重新绑定会删除当前实例中的测验、版本、邀约与答题归档数据，但会保留候选人与简历。</p>
                      </div>
                      <button
                        x-show="!rebindForm.open"
                        @click="openRebindForm"
                        type="button"
                        :disabled="isSyncBusy()"
                        class="inline-flex items-center gap-2 rounded-lg border border-rose-200 bg-white px-4 py-2.5 text-sm font-medium text-rose-700 transition hover:bg-rose-100"
                        :style="isSyncBusy() ? 'opacity:0.72; cursor:not-allowed;' : ''"
                      >
                        <span class="material-symbols-rounded text-base">warning</span>
                        <span>重新绑定</span>
                      </button>
                    </div>

                    <div x-show="rebindForm.open" class="mt-4 space-y-3">
                      <label class="block">
                        <span class="mb-2 block text-xs font-semibold uppercase tracking-[0.18em] text-rose-500">新仓库地址</span>
                        <input
                          x-model="rebindForm.repoUrl"
                          :readonly="isSyncBusy()"
                          class="w-full rounded-lg border border-rose-200 bg-white px-4 py-3 text-sm outline-none"
                          placeholder="https://example.com/repo.git"
                        />
                      </label>
                      <label class="block">
                        <span class="mb-2 block text-xs font-semibold uppercase tracking-[0.18em] text-rose-500">确认词</span>
                        <input
                          x-model="rebindForm.confirmationText"
                          :readonly="isSyncBusy()"
                          class="w-full rounded-lg border border-rose-200 bg-white px-4 py-3 text-sm outline-none"
                          placeholder="请输入：重新绑定"
                        />
                      </label>
                      <div class="rounded-2xl border border-rose-100 bg-white/80 px-4 py-3 text-xs leading-6 text-rose-600">
                        删除范围：测验、版本、邀约、答题结果与归档。
                        <br />
                        保留范围：候选人、简历、系统日志与运行时配置。
                      </div>
                      <div class="flex flex-wrap gap-2">
                        <button
                          @click="confirmRebind"
                          type="button"
                          :disabled="isSyncBusy() || rebindForm.confirmationText !== '重新绑定'"
                          class="inline-flex items-center gap-2 rounded-lg bg-rose-600 px-4 py-2.5 text-sm font-medium text-white transition hover:bg-rose-700"
                          :style="(isSyncBusy() || rebindForm.confirmationText !== '重新绑定') ? 'opacity:0.72; cursor:not-allowed;' : ''"
                        >
                          <span class="material-symbols-rounded text-base">delete_forever</span>
                          <span>确认重新绑定并删除现有测验数据</span>
                        </button>
                        <button
                          @click="closeRebindForm"
                          type="button"
                          :disabled="isSyncBusy()"
                          class="inline-flex items-center gap-2 rounded-lg border border-rose-200 bg-white px-4 py-2.5 text-sm font-medium text-rose-700 transition hover:bg-rose-100"
                          :style="isSyncBusy() ? 'opacity:0.72; cursor:not-allowed;' : ''"
                        >
                          <span class="material-symbols-rounded text-base">close</span>
                          <span>取消</span>
                        </button>
                      </div>
                    </div>
                  </div>
                </div>

                <section class="mt-5 border-t border-slate-200 pt-4" aria-label="仓库同步摘要" aria-live="polite">
                  <div class="flex flex-wrap items-center justify-between gap-2">
                    <h3 class="text-sm font-semibold text-slate-900">同步状态</h3>
                    <span class="rounded-full border px-2.5 py-1 text-xs font-medium" :class="quizSyncStatusClass()" x-text="quizSyncStatusLabel()"></span>
                  </div>
                  <dl class="mt-3 space-y-2 text-xs leading-5">
                    <div x-show="syncState.finished_at" class="flex flex-wrap justify-between gap-x-3"><dt class="text-slate-500">最近结束</dt><dd class="tabular-nums text-slate-700" x-text="formatDateTime(syncState.finished_at)"></dd></div>
                    <div x-show="isSyncBusy() && (syncState.started_at || syncState.queued_at)" class="flex flex-wrap justify-between gap-x-3"><dt class="text-slate-500" x-text="syncState.started_at ? '开始时间' : '排队时间'"></dt><dd class="tabular-nums text-slate-700" x-text="formatDateTime(syncState.started_at || syncState.queued_at)"></dd></div>
                    <div x-show="syncState.last_commit"><dt class="text-slate-500">最后成功提交</dt><dd class="mt-1 break-all font-mono text-slate-700" x-text="syncState.last_commit"></dd></div>
                  </dl>
                  <p x-show="syncStatus() === 'failed' && syncState.last_error" class="mt-3 rounded-lg border border-rose-200 bg-rose-50 p-3 text-xs leading-6 text-rose-700 [overflow-wrap:anywhere]" x-text="syncState.last_error"></p>
                  <details x-show="syncStatus() === 'done'" class="mt-3 border-t border-slate-200 pt-2">
                    <summary class="cursor-pointer py-1 text-xs font-medium text-slate-700">同步结果 <span x-show="Number(quizSyncResult().error_count || 0) > 0" class="text-amber-800" x-text="' · ' + (quizSyncResult().error_count || 0) + ' 个条目失败'"></span></summary>
                    <div class="mt-3 space-y-3">
                      <template x-for="group in quizSyncCountGroups()" :key="group.label">
                        <section><h4 class="text-xs font-semibold text-slate-700" x-text="group.label"></h4><dl class="mt-2 grid grid-cols-2 gap-x-3 gap-y-1 text-xs"><template x-for="count in group.counts" :key="count.label"><div class="flex justify-between gap-2"><dt class="text-slate-500" x-text="count.label"></dt><dd class="tabular-nums text-slate-700" x-text="count.value"></dd></div></template></dl></section>
                      </template>
                      <div x-show="quizSyncErrors().length" class="space-y-2 border-t border-slate-200 pt-3">
                        <template x-for="(error, index) in quizSyncErrors()" :key="index"><div class="rounded-lg bg-amber-50 p-2 text-xs leading-5 text-amber-900 [overflow-wrap:anywhere]"><div class="font-medium" x-text="error.kind === 'job_description' ? '职位' : '测验'"></div><div class="font-mono" x-text="error.source_path || error.quiz_key || error.jd_key || '-'"></div><p x-text="error.error || ''"></p></div></template>
                      </div>
                    </div>
                  </details>
                </section>
                </div>
              </section>
            </div>
          </div>
